[workspace]
members = ["packages/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Casper Rogild Storm", "Cory Forsstrom"]
license = "GPL-3.0-or-later"
edition = "2024"

[workspace.dependencies]
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.12"

halloy_theme = { git = "https://github.com/squidowl/halloy", rev = "ea7eeaed63f741b06dfbdb94382ea5304179f008", package = "theme" }
wasm-bindgen = { version = "0.2.100", features = ["serde_json"] }

[patch.crates-io]
iced_core = { git = "https://github.com/squidowl/iced", rev = "138b1d0ddc86e108f7d4f25765afca126a8dc166" }
